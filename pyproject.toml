[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-health-index"
version = "0.1.0"
description = "Asset Health Index platform using BP Neural Network and Mahalanobis Distance"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ahi-pipeline = "asset_health_index.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
